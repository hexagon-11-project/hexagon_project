name: GCP SSH Connection Test

on:
  push:
    branches:
      - dev

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_KEY }}
          GCP_HOST: ${{ secrets.GCP_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$GCP_HOST" >> ~/.ssh/known_hosts

      - name: Connect to GCP VM
        env:
          GCP_HOST: ${{ secrets.GCP_HOST }}
          GCP_USER: ${{ secrets.GCP_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$GCP_USER@$GCP_HOST" \
            'echo "GitHub Actions SSH connection successful"; whoami; hostname; touch /home/deploy/upload/github-actions-test.txt'